# Desktop app builds for a release. Pushing a version tag (`npm run release`, then
# `git push --follow-tags`; see "Releases" in docs/DEVELOPMENT.md) builds a universal
# macOS .dmg, a portable Windows .zip and Linux tarballs (x86_64 and arm64), all
# unsigned, and publishes them as a GitHub release. A pre-release tag (v0.7.0-beta.1)
# makes a GitHub pre-release, for the beta channel. Each build also makes the archive the
# app downloads to update itself (`tinyjs publish`), and the release job then points the
# update manifests, kept on the `updates` branch, at the new version (see "Updates" in
# docs/DEVELOPMENT.md). Run it by hand (Actions → Release → Run workflow) to
# test the builds: they are kept as workflow artifacts, and no release is made.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # The TinyJS release the app is built with.
  TINYJS_VERSION: v0.72.0
  # Release files are downloaded through the GitHub API (gh release download), not the
  # TinyJS installers: github.com/<repo>/releases/download/ links can fail with 504 for
  # hours on end, while the API keeps serving the same files.
  GH_TOKEN: ${{ github.token }}

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Check that the tag matches the version
        if: github.ref_type == 'tag'
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json ($version): use npm run release"
            exit 1
          fi
      - run: npm run check
      - run: npm test
      - name: Install TinyJS
        run: |
          cd "$RUNNER_TEMP"
          gh release download "$TINYJS_VERSION" -R tarwin/tinyjsapp -p tinyjs-macos-arm64.tar.gz -p checksums.txt
          grep ' tinyjs-macos-arm64.tar.gz$' checksums.txt | shasum -a 256 -c -
          mkdir -p ~/.tinyjs
          tar -xzf tinyjs-macos-arm64.tar.gz -C ~/.tinyjs --strip-components 1
      # The universal build adds the Intel txiki.js runtime, which tinyjs would download
      # itself; put it in tinyjs's cache instead. tinyjs checks it against its pinned sha256.
      - name: Fetch the Intel runtime
        run: |
          txiki="v$(~/.tinyjs/tinyjs version | sed -E 's/.*txiki\.js ([0-9.]+).*/\1/')"
          cache=~/Library/Caches/tinyjs/txiki-"$txiki"
          gh release download "$txiki" -R saghul/txiki.js -p txiki-macos-x86_64.zip -D "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/txiki-macos-x86_64.zip" -d "$RUNNER_TEMP"
          mkdir -p "$cache"
          mv "$RUNNER_TEMP/txiki-macos-x86_64/tjs" "$cache/tjs-x86_64"
      # One app for Apple Silicon and Intel Macs; ad-hoc signed (no Developer ID). Also
      # zips it for updates: dist/publish/narwhal-<version>.zip and its manifest.json.
      - run: ~/.tinyjs/tinyjs publish --universal --dmg
      # The file names carry no version, so that the README can link to
      # releases/latest/download/<name>.
      - name: Name the disk image
        run: |
          version="$(node -p "require('./package.json').version")"
          mv dist/narwhal-"$version".dmg Singing-Narwhal-macos.dmg
          mv dist/publish/narwhal-* .
          mv dist/publish/manifest.json manifest-macos.json
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            Singing-Narwhal-macos.dmg
            narwhal-*
            manifest-macos.json
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # The installer verifies nothing when given a local zip, so check it here.
      - name: Install TinyJS
        run: |
          Set-Location $env:RUNNER_TEMP
          gh release download $env:TINYJS_VERSION -R tarwin/tinyjsapp -p tinyjs-windows-x86_64.zip -p checksums.txt
          $line = Get-Content checksums.txt | Where-Object { $_ -match ' tinyjs-windows-x86_64\.zip$' }
          $expected = ($line -split '\s+')[0]
          $actual = (Get-FileHash tinyjs-windows-x86_64.zip -Algorithm SHA256).Hash
          if ($actual -ne $expected.ToUpper()) { throw "checksum verification FAILED (expected $expected, got $actual)" }
          $env:TINYJS_INSTALL_ZIP = Join-Path $env:RUNNER_TEMP tinyjs-windows-x86_64.zip
          irm https://tinyjs.app/install.ps1 | iex
          # The installer adds itself to the user PATH, which this shell doesn't see.
          Add-Content $env:GITHUB_PATH "$env:LOCALAPPDATA\tinyjs"
      # Builds dist/ and the update archive, dist/publish/narwhal-<version>-win.zip.
      - run: tinyjs publish
      # A portable folder: narwhal.exe (the app, with its pages inside) and
      # launcher.exe, which must stay next to it.
      - name: Zip the app
        run: |
          New-Item -ItemType Directory 'Singing Narwhal' | Out-Null
          Copy-Item dist/narwhal.exe, dist/launcher.exe 'Singing Narwhal'
          Compress-Archive -Path 'Singing Narwhal' -DestinationPath Singing-Narwhal-windows.zip
          Move-Item dist/publish/narwhal-* .
          Move-Item dist/publish/manifest.json manifest-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Singing-Narwhal-windows.zip
            narwhal-*
            manifest-windows.json
          if-no-files-found: error

  linux:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # WebKitGTK is the system web view the app runs in.
      - name: Install TinyJS
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0
          cd "$RUNNER_TEMP"
          asset=tinyjs-linux-${{ matrix.arch }}.tar.gz
          gh release download "$TINYJS_VERSION" -R tarwin/tinyjsapp -p "$asset" -p checksums.txt
          grep " $asset\$" checksums.txt | sha256sum -c -
          mkdir -p ~/.tinyjs
          tar -xzf "$asset" -C ~/.tinyjs --strip-components 1
      # Builds dist/ and the update archive, dist/publish/narwhal-<version>-linux-<arch>.tar.gz.
      - run: ~/.tinyjs/tinyjs publish
      # A portable folder: narwhal (the app, with its pages inside), launcher and
      # icon.png, which must stay next to it. A tarball keeps them executable.
      - name: Pack the app
        run: |
          mkdir 'Singing Narwhal'
          cp dist/narwhal dist/launcher dist/icon.png 'Singing Narwhal'
          tar -czf Singing-Narwhal-linux-${{ matrix.arch }}.tar.gz 'Singing Narwhal'
          mv dist/publish/narwhal-* .
          mv dist/publish/manifest.json manifest-linux-${{ matrix.arch }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            Singing-Narwhal-linux-${{ matrix.arch }}.tar.gz
            narwhal-*
            manifest-linux-${{ matrix.arch }}.json
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish the release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## Download

          - **macOS** (Apple Silicon and Intel): `Singing-Narwhal-macos.dmg`. Open it and drag
            Singing Narwhal to Applications. The app isn't signed by Apple, so the first time
            macOS says it "could not verify" it: click **Done**, then go to System Settings →
            Privacy & Security and click **Open Anyway**, or run
            `xattr -dr com.apple.quarantine "/Applications/Singing Narwhal.app"` in Terminal.
          - **Windows** (beta): `Singing-Narwhal-windows.zip`. Unzip it anywhere and run
            `narwhal.exe` (keep `launcher.exe` next to it). Windows may warn that it protected
            your PC: click **More info → Run anyway**. Needs the WebView2 runtime, included in
            Windows 11.
          - **Linux** (beta): `Singing-Narwhal-linux-x86_64.tar.gz`, or `-arm64` for ARM
            computers. Unpack it anywhere and run `narwhal` (keep `launcher` and `icon.png`
            next to it). Needs WebKitGTK 4.1: `sudo apt install libwebkit2gtk-4.1-0` on
            Debian/Ubuntu (24.04 or newer).

          The `narwhal-*` files are the ones the app downloads to update itself.

          EOF
          # v0.7.0-beta.1: a pre-release, which releases/latest/ and the README links skip.
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" Singing-Narwhal-* narwhal-* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Singing Narwhal ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --generate-notes \
            "${prerelease[@]}"
      # The app checks for updates on the `updates` branch, through raw.githubusercontent.com
      # (releases/download/ links fail with 504 too often for a file every update starts
      # from): betas (built with a pre-release version) in beta-manifest.json, other
      # versions in manifest.json. A beta updates only beta-manifest.json; a release updates
      # both, so beta users get it too (and, since it reads manifest.json, are back on the
      # release channel). The branch holds only these files, with no history in common
      # with main; the first release creates it.
      - name: Update the update manifests
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node ../scripts/update-manifest.mjs "$GITHUB_REF_NAME" manifest-*.json > beta-manifest.json
          manifests=(beta-manifest.json)
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            cp beta-manifest.json manifest.json
            manifests+=(manifest.json)
          fi
          # A dead download link would make the updater fail on users' computers. Each one
          # must name a file of this release; they are checked through the API rather than
          # fetched, since releases/download/ links often fail with 504 for a while.
          assets="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for url in $(jq -r '.. | .url? // empty' beta-manifest.json | sort -u); do
            if [[ "$url" != "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/"* ]] ||
               ! grep -qxF "${url##*/}" <<< "$assets"; then
              echo "::error::$url is not a file of release $GITHUB_REF_NAME"
              exit 1
            fi
          done
          cd ..
          if git fetch --depth 1 origin updates; then
            git switch -c updates FETCH_HEAD
          else
            git switch --orphan updates
          fi
          for f in "${manifests[@]}"; do cp "release/$f" .; done
          git add "${manifests[@]}"
          git -c user.name='github-actions[bot]' \
              -c user.email='41898283+github-actions[bot]@users.noreply.github.com' \
              commit -m "Updates: $GITHUB_REF_NAME"
          git push origin updates
