# Desktop app builds for a release. Pushing a version tag (`npm run release`, then
# `git push --follow-tags`; see "Releases" in docs/DEVELOPMENT.md) builds a universal
# macOS .dmg, a portable Windows .zip and Linux tarballs (x86_64 and arm64), all
# unsigned, and publishes them as a GitHub release. Run it by hand (Actions → Release →
# Run workflow) to test the builds: they are kept as workflow artifacts, and no release
# is made.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # The TinyJS release the app is built with; both installers read it.
  TINYJS_VERSION: v0.53.1

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Check that the tag matches the version
        if: github.ref_type == 'tag'
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json ($version): use npm run release"
            exit 1
          fi
      - run: npm run check
      - run: npm test
      - name: Install TinyJS
        run: curl -fsSL https://tinyjs.app/install | sh
      # One app for Apple Silicon and Intel Macs; ad-hoc signed (no Developer ID).
      - run: ~/.tinyjs/tinyjs build --universal --dmg
      # The file names carry no version, so that the README can link to
      # releases/latest/download/<name>.
      - name: Name the disk image
        run: |
          version="$(node -p "require('./package.json').version")"
          mv dist/narwhal-"$version".dmg Singing-Narwhal-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Singing-Narwhal-macos.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Install TinyJS
        run: |
          irm https://tinyjs.app/install.ps1 | iex
          # The installer adds itself to the user PATH, which this shell doesn't see.
          Add-Content $env:GITHUB_PATH "$env:LOCALAPPDATA\tinyjs"
      - run: tinyjs build
      # A portable folder: narwhal.exe (the app, with its pages inside) and
      # launcher.exe, which must stay next to it.
      - name: Zip the app
        run: |
          New-Item -ItemType Directory 'Singing Narwhal' | Out-Null
          Copy-Item dist/narwhal.exe, dist/launcher.exe 'Singing Narwhal'
          Compress-Archive -Path 'Singing Narwhal' -DestinationPath Singing-Narwhal-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Singing-Narwhal-windows.zip
          if-no-files-found: error

  linux:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # The installer checks that the system WebKitGTK, which the app runs in, is there.
      - name: Install TinyJS
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0
          curl -fsSL https://tinyjs.app/install | sh
      - run: ~/.tinyjs/tinyjs build
      # A portable folder: narwhal (the app, with its pages inside), launcher and
      # icon.png, which must stay next to it. A tarball keeps them executable.
      - name: Pack the app
        run: |
          mkdir 'Singing Narwhal'
          cp dist/narwhal dist/launcher dist/icon.png 'Singing Narwhal'
          tar -czf Singing-Narwhal-linux-${{ matrix.arch }}.tar.gz 'Singing Narwhal'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: Singing-Narwhal-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## Download

          - **macOS** (Apple Silicon and Intel): `Singing-Narwhal-macos.dmg`. Open it and drag
            Singing Narwhal to Applications. The app isn't signed by Apple, so the first time
            macOS refuses to open it: go to System Settings → Privacy & Security and click
            **Open Anyway**.
          - **Windows** (beta): `Singing-Narwhal-windows.zip`. Unzip it anywhere and run
            `narwhal.exe` (keep `launcher.exe` next to it). Windows may warn that it protected
            your PC: click **More info → Run anyway**. Needs the WebView2 runtime, included in
            Windows 11.
          - **Linux** (beta): `Singing-Narwhal-linux-x86_64.tar.gz`, or `-arm64` for ARM
            computers. Unpack it anywhere and run `narwhal` (keep `launcher` and `icon.png`
            next to it). Needs WebKitGTK 4.1: `sudo apt install libwebkit2gtk-4.1-0` on
            Debian/Ubuntu (24.04 or newer).

          EOF
          gh release create "$GITHUB_REF_NAME" Singing-Narwhal-* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Singing Narwhal ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --generate-notes
